name: CI

# Runs on every push and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless, so cancel it.
# Runs on main are never cancelled, so the badge always reflects a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway database that exists only for this run. POSTGRES_DB creates it at start-up.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: car_dealership_test
        ports:
          - 5432:5432
        # Do not start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d car_dealership_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The backend tests wipe and rebuild this database; they refuse any URL that does not end in car_dealership_test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/car_dealership_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
